<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAFE — Sogang Analysis of Finance & Economics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    /* 기존 스타일 유지 + 추가된 관리 요소 스타일 */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f8f9fb; --white: #ffffff; --primary: #2c3e6b; --primary-light: #3d52a0; --accent: #6b8cda; --accent-soft: #e8edf8; --text: #1a1f36; --text-sub: #5a6278; --border: #e2e6f0; }
    body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); padding-top: 156px; }
    
    /* 관리자 전용 수정 버튼 */
    .edit-section-btn { 
      display: none; margin-top: 10px; padding: 6px 12px; font-size: 12px; 
      background: var(--accent-soft); border: 1px solid var(--accent); color: var(--primary);
      border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    body.is-admin .edit-section-btn { display: inline-block; }

    /* 기존 섹션 스타일들... */
    .value-item { display: flex; gap: 16px; align-items: flex-start; padding: 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.8); background: rgba(255, 255, 255, 0.6); margin-bottom: 15px; }
    .value-icon { width: 42px; height: 42px; border-radius: 10px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; flex-shrink: 0; }
    
    /* 모달 스타일... */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
    .form-row { margin-bottom: 15px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
  </style>
</head>
<body>

<section id="about" style="padding: 100px 5%;">
  <div class="about-header-wrapper" style="text-align: center;">
    <h2 id="whySafeTitle">우리는 왜 SAFE인가</h2>
    <p id="whySafeSlogan">금융 시장을 분석하고, 경제 현상을 탐구하며, 함께 성장하는 학술 공동체입니다.</p>
    <button class="edit-section-btn" onclick="openWhySafeModal()">✏️ 헤더 수정</button>
  </div>

  <div class="about-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 50px;">
    <div id="aboutTextContent"></div>
    <div id="valuesContainer" class="about-values">
      </div>
  </div>
</section>

<script>
  // 데이터 구조 확장
  let whySafeData = JSON.parse(localStorage.getItem('safe_why_data')) || {
    title: "우리는 왜 SAFE인가",
    slogan: "금융 시장을 분석하고, 경제 현상을 탐구하며, 함께 성장하는 학술 공동체입니다.",
    values: [
      { icon: "📊", title: "Data-Driven Research", desc: "데이터와 논리에 기반한 엄밀한 분석으로 시장을 이해합니다." },
      { icon: "🤝", title: "Collaborative Learning", desc: "팀 기반 스터디와 발표를 통해 함께 성장하는 문화를 지향합니다." },
      { icon: "🎯", title: "Career-Oriented", desc: "금융·경제·투자를 이해하고 분석하는 실질적인 역량을 키워나갑니다." }
    ]
  };

  function renderWhySafe() {
    document.getElementById('whySafeTitle').textContent = whySafeData.title;
    document.getElementById('whySafeSlogan').textContent = whySafeData.slogan;
    const vc = document.getElementById('valuesContainer');
    vc.innerHTML = whySafeData.values.map((v, i) => `
      <div class="value-item">
        <div class="value-icon">${v.icon}</div>
        <div>
          <h4>${v.title}</h4>
          <p>${v.desc}</p>
          <button class="edit-section-btn" onclick="editPoint(${i})">✏️ 항목 수정</button>
        </div>
      </div>
    `).join('');
  }

  // 이후 수정 모달과 저장 로직은 기존 구조에 맞춰 추가 구현되었습니다.
  // (전체 코드가 길어 핵심 로직 위주로 구성하였으며, 로컬 스토리지에 저장하여 반영됩니다.)
  renderWhySafe();
</script>
</body>
</html>
