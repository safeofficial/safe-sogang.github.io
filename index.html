<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAFE — Sogang Analysis of Finance & Economics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f9fb;
      --white: #ffffff;
      --primary: #2c3e6b;
      --primary-light: #3d52a0;
      --accent: #6b8cda;
      --accent-soft: #e8edf8;
      --text: #1a1f36;
      --text-sub: #5a6278;
      --border: #e2e6f0;
      --nav-h: 68px;
    }

    html { scroll-behavior: smooth; scroll-padding-top: 156px; }

    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-top: 156px; 
    }

    /* ── TICKER TAPE ── */
    .ticker-tape-wrap {
      position: fixed; top: 0; left: 0; right: 0;
      height: 88px; overflow: hidden; background: white; z-index: 100;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 88px; left: 0; right: 0; height: var(--nav-h);
      background: rgba(255,255,255,0.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5%; z-index: 100;
    }
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-mark {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: white; letter-spacing: 0.5px;
    }
    .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
    .logo-text .brand { font-weight: 700; font-size: 17px; color: var(--primary); }
    .logo-text .sub { font-size: 10px; color: var(--text-sub); letter-spacing: 0.3px; }
    .nav-links { display: flex; gap: 8px; }
    .nav-links a {
      text-decoration: none; font-size: 14px; font-weight: 500;
      color: var(--text-sub); padding: 7px 14px; border-radius: 8px; transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--primary); background: var(--accent-soft); }

    /* ── 🌟 TOP PARALLAX CONTAINER ── */
    .top-parallax-container {
      position: relative;
      overflow: hidden; 
    }

    /* 배경 사진 */
    .top-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&q=80&w=2000');
      background-repeat: no-repeat;
      background-position: center top;
      background-size: cover;
      z-index: 0;
      will-change: transform, opacity;
      transform-origin: center center;
    }

    /* 오버레이 (가독성을 위한 반투명 막) */
    .top-bg::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(248, 249, 251, 0.85); 
    }

    /* ── SECTIONS COMMON ── */
    section { position: relative; z-index: 2; background: var(--bg); }
    .section-header { text-align: center; margin-bottom: 60px; }
    .section-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
    .section-header h2 { font-size: 2rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .section-header p { color: var(--text-sub); font-size: 1rem; max-width: 500px; margin: 0 auto; }

    /* ── HERO ── */
    #home {
      position: relative;
      z-index: 1; 
      min-height: calc(100vh - 156px); 
      display: flex; align-items: center; justify-content: center;
      padding: 40px 5% 80px; text-align: center;
      background: transparent !important; 
    }
    
    .hero-inner { max-width: 760px; }
    
    .hero-badge {
      display: inline-block; 
      background: rgba(44, 62, 107, 0.08); 
      color: var(--primary);
      font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
      padding: 6px 16px; border-radius: 20px; margin-bottom: 28px;
    }
    
    .hero-inner h1 { 
      font-size: clamp(2.4rem, 5vw, 3.8rem); font-weight: 700; color: var(--primary); 
      line-height: 1.2; margin-bottom: 20px;
    }
    .hero-inner h1 span { color: var(--primary-light); }
    .hero-inner p { 
      font-size: 1.1rem; color: #1a1f36; font-weight: 600; 
      max-width: 540px; margin: 0 auto 40px; 
    }
    
    .hero-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn-primary { background: var(--primary); color: white; font-size: 15px; font-weight: 600; padding: 13px 28px; border-radius: 10px; text-decoration: none; border: none; cursor: pointer; transition: all 0.2s;}
    .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); }
    .btn-outline { background: transparent; color: var(--primary); font-size: 15px; font-weight: 600; padding: 13px 28px; border-radius: 10px; text-decoration: none; border: 1.5px solid var(--primary); transition: all 0.2s; }
    .btn-outline:hover { background: var(--primary); color: var(--white); }
    
    .hero-stats { display: flex; gap: 40px; justify-content: center; margin-top: 60px; flex-wrap: wrap; }
    .stat-num { font-size: 2rem; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 13px; font-weight: 600; color: var(--text-sub); margin-top: 2px; }

    /* ── 🌟 ABOUT SECTION (전체 투명화) ── */
    #about {
      background: transparent !important;
      padding: 60px 5% 120px;
    }

    .about-header-wrapper {
      text-align: center;
      margin-bottom: 60px;
    }
    .about-header-wrapper h2 { font-size: 2rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .about-header-wrapper p { color: var(--text-sub); font-weight: 500; font-size: 1rem; max-width: 500px; margin: 0 auto; }

    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; max-width: 1100px; margin: 0 auto; }
    .about-text h3 { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
    .about-text p { color: var(--text-sub); margin-bottom: 20px; font-size: 0.97rem; white-space: pre-line; }
    .about-values { display: flex; flex-direction: column; gap: 18px; }
    
    .value-item { 
      display: flex; gap: 16px; align-items: flex-start; 
      padding: 20px; 
      border-radius: 12px; 
      border: 1px solid rgba(255, 255, 255, 0.8); 
      background: rgba(255, 255, 255, 0.6); 
      backdrop-filter: blur(12px); 
      box-shadow: 0 4px 24px rgba(44, 62, 107, 0.05);
    }
    .value-icon { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; color: white; }
    .value-item h4 { font-size: 0.95rem; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
    .value-item p { font-size: 0.87rem; color: var(--text-sub); }

    /* ── DROPDOWN (기수 선택) ── */
    .gen-select-container { text-align: center; margin-bottom: 32px; }
    .gen-select {
      padding: 10px 36px 10px 18px;
      font-size: 14px; font-weight: 600; color: var(--primary);
      background-color: white; border: 1px solid var(--border);
      border-radius: 20px; cursor: pointer; outline: none;
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%232c3e6b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat; background-position: right 14px top 50%; background-size: 10px auto;
      transition: all 0.2s;
    }
    .gen-select:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(44, 62, 107, 0.05); }

    /* ── 하얀색 본문 시작 영역 ── */
    .main-content-wrapper {
      position: relative;
      z-index: 2;
      background: var(--bg);
    }

    /* ── MARKET OVERVIEW ── */
    #market { background: var(--bg); padding: 100px 5%; border-top: 1px solid var(--border); }
    .market-widget-container {
      max-width: 1100px; margin: 0 auto; height: 500px; 
      background: white; border: 1px solid var(--border); border-radius: 14px; 
      overflow: hidden; box-shadow: 0 12px 32px rgba(44,62,107,0.05);
    }

    /* ── REPORTS ── */
    #reports { background: var(--white); padding: 100px 5%; }
    .reports-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto; }
    .report-card { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 24px; transition: all 0.25s; cursor: pointer; }
    .report-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(44,62,107,0.08); background: white;}
    .report-tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; margin-bottom: 14px; }
    .tag-macro { background: #e8f0fe; color: #3d52a0; }
    .tag-equity { background: #e6f4ea; color: #2e7d32; }
    .report-card h3 { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .report-card p { font-size: 0.86rem; color: var(--text-sub); margin-bottom: 16px; }
    .report-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-sub); border-top: 1px solid var(--border); padding-top: 14px; }
    .report-dl { font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; }

    /* ── MEMBERS ── */
    #members { background: var(--bg); padding: 100px 5%; }
    .members-scroll-wrap { max-width: 1100px; margin: 0 auto; max-height: 700px; overflow-y: auto; padding: 4px 8px 16px; scrollbar-width: thin; scrollbar-color: var(--accent) var(--border); }
    .leaders-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin-bottom: 40px; }
    .leaders-grid .member-card { flex: 0 1 280px; border-color: var(--accent); border-width: 2px; background: white; }
    .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px; }
    .member-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 28px 20px; text-align: center; transition: all 0.25s; }
    .member-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(44,62,107,0.08); }
    .member-avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: white; margin: 0 auto 16px; }
    .member-card h4 { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .member-role { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .member-card p { font-size: 0.83rem; color: var(--text-sub); }

    /* ── NEWS ── */
    #news { background: var(--white); padding: 100px 5%; }
    .news-scroll-wrap { max-width: 1100px; margin: 0 auto; overflow-x: auto; padding-bottom: 16px; scrollbar-width: thin; scrollbar-color: var(--accent) var(--border); }
    .news-row { display: flex; gap: 24px; padding: 4px; }
    .news-card { flex: 0 0 320px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: all 0.25s; }
    .news-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(44,62,107,0.08); background: white; }
    .news-header { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; }
    .news-type { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; }
    .type-notice { background: #fff8e1; color: #f57f17; }
    .type-recruit { background: #e8f5e9; color: #2e7d32; }
    .type-event { background: #e3f2fd; color: #1565c0; }
    .news-date { font-size: 12px; color: var(--text-sub); }
    .news-body { padding: 14px 24px 24px; }
    .news-card h3 { font-size: 0.97rem; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .news-card p { font-size: 0.86rem; color: var(--text-sub); }

    /* ── ADMIN ELEMENTS ── */
    .admin-only { display: none !important; }
    body.is-admin .admin-only { display: block !important; }

    .add-btn, .edit-about-btn {
      padding: 10px 22px; border-radius: 10px; border: 1px solid var(--accent); background: var(--white);
      color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .add-btn:hover, .edit-about-btn:hover { background: var(--accent-soft); }
    .edit-about-btn { margin-top: 16px; }

    .card-admin-actions { display: none; gap: 6px; margin-bottom: 12px; }
    body.is-admin .card-admin-actions { display: flex; }
    .card-admin-actions button { flex: 1; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: white; transition: all 0.15s; }
    .card-edit-btn { color: var(--primary); }
    .card-edit-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
    .card-del-btn { color: #c62828; }
    .card-del-btn:hover { background: #fce8e6; border-color: #c62828; }

    /* ── MODALS ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(26, 31, 54, 0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: white; border-radius: 16px; padding: 28px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal-box h3 { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-bottom: 20px; }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-sub); margin-bottom: 5px; }
    .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--accent); }
    .form-row textarea { resize: vertical; }
    .form-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .modal-error { font-size: 0.83rem; color: #c62828; min-height: 18px; margin-bottom: 8px; text-align: center; }
    .modal-btns { display: flex; gap: 10px; margin-top: 8px; }
    .modal-btns button { flex: 1; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
    .btn-cancel { background: var(--bg); color: var(--text-sub); }
    .btn-cancel:hover { background: var(--border); }
    .btn-confirm { background: var(--primary); color: white; }
    .btn-confirm:hover { background: var(--primary-light); }

    .admin-btn { margin-left: 12px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: white; color: var(--text-sub); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .admin-btn:hover, .admin-btn.logged-in { border-color: var(--primary); color: var(--primary); background: var(--accent-soft); }

    .admin-badge-float { position: fixed; bottom: 24px; right: 24px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; padding: 10px 18px; border-radius: 24px; font-size: 12px; font-weight: 700; box-shadow: 0 6px 18px rgba(44,62,107,0.25); z-index: 99; display: none; }
    .admin-badge-float.visible { display: block; }

    /* ── FOOTER ── */
    footer { background: var(--primary); color: rgba(255,255,255,0.7); padding: 48px 5% 32px; position: relative; z-index: 2;}
    .footer-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 32px; padding-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,0.15); }
    .footer-brand .brand-name { font-size: 1.3rem; font-weight: 700; color: white; margin-bottom: 6px; }
    .footer-brand p { font-size: 0.85rem; max-width: 280px; }
    .footer-links { display: flex; gap: 32px; flex-wrap: wrap; }
    .footer-col h5 { color: white; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
    .footer-col a { display: block; color: rgba(255,255,255,0.6); font-size: 13px; text-decoration: none; margin-bottom: 8px; transition: color 0.2s; }
    .footer-col a:hover { color: white; }
    .footer-bottom { max-width: 1100px; margin: 24px auto 0; display: flex; justify-content: space-between; font-size: 12px; flex-wrap: wrap; gap: 8px; }

    @media (max-width: 768px) {
      .about-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .footer-inner { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="top-parallax-container" id="topParallax">
  
  <div class="top-bg" id="topBg"></div>

  <section id="home">
    <div class="hero-inner">
      <div class="hero-badge">Sogang University · Finance & Economics</div>
      <h1>Analyze.<br/><span>Understand. Invest.</span></h1>
      <p>서강대학교 경제·금융 학술 학회 SAFE는 거시경제, 주식, 채권, 퀀트 분야의 깊이 있는 리서치를 통해 금융 전문가를 양성합니다.</p>
