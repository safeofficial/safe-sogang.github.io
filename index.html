<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAFE — Sogang Analysis of Finance & Economics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f8f9fb; --white: #ffffff; --primary: #2c3e6b; --primary-light: #3d52a0; --accent: #6b8cda; --accent-soft: #e8edf8; --text: #1a1f36; --text-sub: #5a6278; --border: #e2e6f0; --nav-h: 68px; }
    html { scroll-behavior: smooth; scroll-padding-top: 156px; }
    body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding-top: 156px; }

    .ticker-tape-wrap { position: fixed; top: 0; left: 0; right: 0; height: 88px; overflow: hidden; background: white; z-index: 100; }
    nav { position: fixed; top: 88px; left: 0; right: 0; height: var(--nav-h); background: rgba(255,255,255,0.96); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 5%; z-index: 100; }
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-mark { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white; }
    .nav-links { display: flex; gap: 8px; align-items: center; }
    .nav-links a { text-decoration: none; font-size: 14px; font-weight: 500; color: var(--text-sub); padding: 7px 14px; border-radius: 8px; transition: all 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--primary); background: var(--accent-soft); }

    .top-parallax-container { position: relative; overflow: hidden; }
    .top-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&q=80&w=2000'); background-repeat: no-repeat; background-position: center top; background-size: cover; z-index: 0; will-change: transform, opacity; transform-origin: center center; }
    .top-bg::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(248, 249, 251, 0.85); }

    section { position: relative; z-index: 2; background: var(--bg); }
    .section-header { text-align: center; margin-bottom: 40px; }
    .section-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
    
    #home { min-height: calc(100vh - 156px); display: flex; align-items: center; justify-content: center; padding: 40px 5% 80px; text-align: center; background: transparent !important; }
    #about { background: transparent !important; padding: 60px 5% 120px; }
    
    /* 대시보드 스위치 버튼 */
    .view-toggle { text-align: center; margin-bottom: 24px; }
    .toggle-btn { padding: 10px 24px; border-radius: 20px; border: 1px solid var(--primary); background: var(--primary); color: white; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.3s; }
    .toggle-btn:hover { background: var(--primary-light); }

    .market-dashboard { display: flex; flex-direction: column; gap: 24px; max-width: 1200px; margin: 0 auto; }
    .market-row { display: grid; gap: 24px; grid-template-columns: 1fr; }
    .market-box { background: #0f0f0f; border-radius: 14px; overflow: hidden; border: 1px solid #2a2e39; min-height: 400px; }
    
    /* 모드별 표시/숨김 */
    .mode-econ { display: none; }
  </style>
</head>
<body>

<div class="top-parallax-container" id="topParallax">
  <div class="top-bg" id="topBg"></div>
  <section id="home">
    <div class="hero-inner" style="max-width: 760px;">
      <div class="hero-badge">Sogang University · Finance & Economics</div>
      <h1>Analyze.<br/><span>Understand. Invest.</span></h1>
      <p>서강대학교 경제·금융 학술 학회 SAFE는 거시경제, 주식, 채권, 퀀트 분야의 깊이 있는 리서치를 통해 금융 전문가를 양성합니다.</p>
    </div>
  </section>
  <section id="about">
    <div class="about-header-wrapper" style="text-align: center;">
      <div class="section-tag">About SAFE</div>
      <h2>우리는 왜 SAFE인가</h2>
    </div>
  </section>
</div>

<div class="main-content-wrapper">
  <div class="ticker-tape-wrap">
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-ticker-tape.js"></script>
    <tv-ticker-tape symbols="FOREXCOM:SPXUSD,FOREXCOM:NSXUSD,FOREXCOM:DJI,BITSTAMP:BTCUSD,BITSTAMP:ETHUSD,BITSTAMP:XRPUSD,TVC:DXY,FX_IDC:USDKRW,OANDA:XAUUSD,TVC:SILVER,TVC:USOIL,IG:RUSSELL" transparent></tv-ticker-tape>
  </div>

  <nav>
    <div class="nav-logo"><div class="logo-mark">SF</div><div class="logo-text"><span class="brand">SAFE</span><span class="sub">Sogang Analysis of Finance & Economics</span></div></div>
    <div class="nav-links">
      <a href="#about" class="active">학회 소개</a>
      <a href="#market">마켓</a>
      <a href="#reports">리서치</a>
      <a href="#members">멤버</a>
      <a href="#news">공지사항</a>
      <button class="admin-btn" id="adminBtn" onclick="handleAdminBtn()">🔒 관리자</button>
    </div>
  </nav>

  <section id="market">
    <div class="section-header">
      <div class="section-tag">Market Overview</div>
      <h2>실시간 글로벌 마켓</h2>
      <div class="view-toggle">
        <button class="toggle-btn" onclick="toggleMarketMode()" id="modeBtn">경제 지표 모드로 보기</button>
      </div>
    </div>
    
    <div class="market-dashboard">
      <div id="default-mode">
        <div class="market-row" style="grid-template-columns: 1fr;">
          <div class="market-box" style="height: 500px;">
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
            { "symbols": [["IG:NASDAQ|1D"],["VANTAGE:SP500|1D"],["BINANCE:BTCUSDT|1D"]], "chartType": "area", "backgroundColor": "#0F0F0F", "colorTheme": "dark", "autosize": true, "locale": "kr" }
            </script>
          </div>
        </div>
        <div class="market-row" style="grid-template-columns: 1fr;">
          <div class="market-box" style="height: 550px;">
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
            { "displayMode": "regular", "feedMode": "all_symbols", "colorTheme": "dark", "backgroundColor": "#0F0F0F", "locale": "kr", "autosize": true }
            </script>
          </div>
        </div>
      </div>

      <div id="econ-mode" class="mode-econ">
        <div class="market-row" style="grid-template-columns: 1fr 1fr;">
          <div class="market-box" style="height: 600px;">
            <script type="module" src="https://widgets.tradingview-widget.com/w/kr/tv-economic-map.js"></script>
            <tv-economic-map theme="dark" transparent="false" style="width: 100%; height: 100%; background: #0F0F0F;"></tv-economic-map>
          </div>
          <div class="market-box" style="height: 600px;">
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
            { "colorTheme": "dark", "countryFilter": "us,kr", "backgroundColor": "#0F0F0F", "autosize": true, "locale": "kr" }
            </script>
          </div>
        </div>
        <div class="market-row" style="grid-template-columns: 2fr 1fr;">
          <div class="market-box" style="height: 400px;">
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-forex-heat-map.js" async>
            { "colorTheme": "dark", "currencies": ["EUR", "USD", "JPY", "CNY", "KRW"], "backgroundColor": "#0F0F0F", "autosize": true, "locale": "kr" }
            </script>
          </div>
          <div class="market-box" style="height: 400px;">
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
            { "displayMode": "compact", "feedMode": "all_symbols", "colorTheme": "dark", "backgroundColor": "#0F0F0F", "locale": "kr", "autosize": true }
            </script>
          </div>
        </div>
      </div>
    </div>
  </section>

  </div>

<script>
  function toggleMarketMode() {
    const defaultMode = document.getElementById('default-mode');
    const econMode = document.getElementById('econ-mode');
    const btn = document.getElementById('modeBtn');
    
    if (defaultMode.style.display === 'none') {
      defaultMode.style.display = 'block';
      econMode.style.display = 'none';
      btn.textContent = '경제 지표 모드로 보기';
    } else {
      defaultMode.style.display = 'none';
      econMode.style.display = 'block';
      btn.textContent = '마켓 차트 모드로 보기';
    }
  }

  // ── 스크롤 효과 ──
  window.addEventListener('scroll', () => {
    const container = document.getElementById('topParallax');
    const bg = document.getElementById('topBg');
    if (!container || !bg) return;
    const scrollY = window.scrollY;
    const containerHeight = container.offsetHeight;
    if (scrollY <= containerHeight) {
      const scrollRatio = scrollY / containerHeight;
      bg.style.transform = `scale(${1 + (scrollRatio * 0.35)}) translate3d(0, 0, 0)`;
      bg.style.opacity = Math.max(0, 1 - (scrollRatio * 1.5)); 
    }
  });
</script>
</body>
</html>
